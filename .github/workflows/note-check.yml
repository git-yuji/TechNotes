name: Note Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Node.jsを設定
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ノートの書式を検証
        run: npm run notes:check

      - name: ノート詳細ページを検証
        run: npm run notes:check-routes
